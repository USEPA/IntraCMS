      body: "<p>A request to modify a shared network folder (<strong>[webform_submission:values:existing_folder]</strong>) that you are the owner of has been submitted by&nbsp;[webform_submission:values:requestor_email] .<br />\r\n<br />\r\n<strong>Please <a href=\"[webform_submission:token-update-url]\">review the request</a> below and update the submission with your approval or disapproval.</strong></p>\r\n\r\n<ol>\r\n\t<li>Go to: <a href=\"[webform_submission:token-update-url]\">[webform_submission:token-update-url]</a></li>\r\n\t<li>Click the <strong>Approval Status</strong> header to expand the <em>Approval Status</em> fields</li>\r\n\t<li>Update the status of the request.</li>\r\n\t<li>Scroll to the bottom of the form and click the <strong>Save&nbsp;</strong>button</li>\r\n</ol>\r\n\r\n<p>Submitted on [webform_submission:created]&nbsp;by: [webform_submission:user] /&nbsp;[webform_submission:values:requestor_email]<br />\r\n<br />\r\n<strong>Request Type:</strong> [webform_submission:values:existing_folder_request_type]<br />\r\n[webform_submission:values:storage]<br />\r\n[webform_submission:values:access]<br />\r\n[webform_submission:values:transfer_ownership]<br />\r\n[webform_submission:values:additional_instructions]</p>\r\n\r\n<hr />\r\n<p>Full submission details:<br />\r\n[webform_submission:values]</p>"
