id: existing_folder_request
title: 'Existing Folder Request'
description: ''
categories:
  - IT
elements: |-
  approval_status:
    '#type': details
    '#title': 'Approval Status'
    '#description': 'Selecting a status of &quot;Not Approved&quot; or &quot;On Hold&quot; will require you to enter a justification.&nbsp; The person who made the request will receive an email notification of the status change.'
    '#help_title': 'Update Status'
    '#help': 'Expand this section to update the status of this request.'
    '#states':
      visible:
        - ':input[name="status"]':
            value: Approved
        - or
        - ':input[name="status"]':
            value: 'On Hold'
        - or
        - ':input[name="status"]':
            value: 'Not Approved'
        - or
        - ':input[name="status"]':
            value: 'Under Review'
    '#states_clear': false
    status:
      '#type': radios
      '#title': Status
      '#options':
        Approved: Approved
        'On Hold': 'On Hold'
        'Not Approved': 'Not Approved'
        'Under Review': 'Under Review'
      '#states_clear': false
      '#admin_title': 'Approval Status'
    justification:
      '#type': textarea
      '#title': Justification
      '#description': 'Provide a justification for why the request was not approved.'
      '#states':
        visible:
          - ':input[name="status"]':
              value: 'Not Approved'
          - or
          - ':input[name="status"]':
              value: 'On Hold'
  requestor_information:
    '#type': fieldset
    '#title': 'Requestor Data'
    '#title_display': invisible
    requestor_email:
      '#type': email
      '#title': 'Requestor Email'
      '#required': true
      '#default_value': '[current-user:mail]'
    organization:
      '#type': select
      '#title': Organization
      '#options': ord_centers_and_offices
      '#required': true
    location:
      '#type': select
      '#title': Location
      '#options': epa_geographic_locations
      '#required': true
  horizontal_rule:
    '#type': webform_horizontal_rule
  work_request_header:
    '#type': webform_markup
    '#display_on': view
    '#markup': '<h2>Work Request Information</h2>'
  existing_folder_new:
    '#type': webform_shs_term_select
    '#title': 'Existing Shared Folder'
    '#description': |-
      Select the location (or ORD for folders across all ORD) from the first dropdown, and then select the folder name from the second dropdown.

      The text below the dropdowns will update to show the folder owner and the folder storage quota.
    '#help_title': Examples
    '#help': |-
      If the folder is L:\PRIV\CIN\OSIM, the location you select in the dropdown box will be CIN.

      If the folder is on the O: drive, the location you select in the dropdown box will be ORD.
    '#required': true
    '#attributes':
      class:
        - cshs-custom-select
    '#vocabulary': all_windows_shares
    '#force_deepest': true
    '#depth_labels': {  }
    '#empty_option': '- Select -'
  no_folder_name:
    '#type': webform_message
    '#message_type': info
    '#message_message': 'If you are unable to locate the exact folder you are looking for, you will be able to provide the exact path in the <strong>Existing Folder Name Found ?</strong> field below.&nbsp;This will sometimes be necessary because we can only drill down three levels at most and in some cases individual folders are further down than that.'
    '#message_close': true
  existing_folder_name:
    '#type': radios
    '#title': 'Existing Folder Name Found?'
    '#description': 'Did the existing folder you selected above drill down to the sub-folder you are looking to modify?'
    '#description_display': before
    '#options': yes_no
    '#required': true
  subfolder_name_and_path:
    '#type': textfield
    '#title': 'Subfolder Name and Path'
    '#description': 'Enter the full path of the subfolder you are looking to modify. Example:&nbsp;O:\PRIV\Science_Communication\2012 Annual Report'
    '#required': true
    '#states':
      visible:
        ':input[name="existing_folder_name"]':
          value: 'No'
  existing_folder_request_type:
    '#type': radios
    '#title': 'Existing Folder Request Type'
    '#options':
      size: 'Change the storage capacity of the shared folder selected above'
      access: 'Add access for one or more users to the shared folder selected above'
      remove-access: 'Remove access for one or more users to the shared folder selected above'
      owner: 'Transfer the ownership of the shared folder selected above to another user'
    '#required': true
  existing_folder_req_msg:
    '#type': webform_message
    '#states':
      visible:
        ':input[name="existing_folder_request_type"]':
          value: size
    '#message_type': error
    '#message_message': 'All requests for changes to storage capacity require the completion of a <a href="https://usepa.sharepoint.com/:w:/s/PublicDocumentLink/Ecg_tZcUZopIvCmyauLCytEBA2zBaYn9bzU5tetqlwiqXA?e=FGvx47">SAN Storage Questionnaire</a>. Please download the form, complete it, and return it to Dwayne Austin (austin.dwayne@epa.gov) and Isidro Avila (avila.isidro@epa.gov). If you have any questions about the form, please contact Dwayne or Isidro.'
  remove_access:
    '#type': webform_section
    '#title': 'Remove Access'
    '#states':
      visible:
        ':input[name="existing_folder_request_type"]':
          value: remove-access
    users_to_remove:
      '#type': textfield
      '#title': 'Users to remove'
      '#multiple': true
      '#description': 'Enter the name of the user whose permissions need to be removed from this folder. Use the <strong>Add another user to remove</strong> button or the <img alt="add more" src="/sites/default/files/2021-05/plus.jpg" />&nbsp;icon to add more users. If you wish to remove a user field you&#39;ve entered, use the <img alt="add more" src="/sites/default/files/2021-05/minus.jpg" /> icon.'
      '#title_display': before
      '#multiple__header_label': 'Users Whose Permissions Will be Removed'
      '#multiple__sorting': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add another user to remove'
  access:
    '#type': webform_section
    '#title': 'Grant Access'
    '#title_tag': h3
    '#states':
      visible:
        ':input[name="existing_folder_request_type"]':
          value: access
    folder_access_names_and_type:
      '#type': webform_custom_composite
      '#title': 'Name(s) and Type of Access'
      '#description': |-
        Enter the name of the user and the type of permission they should have to this folder. Use the <strong>Add another user</strong> button or the <img alt="add more" src="/sites/default/files/2021-05/plus.jpg" />&nbsp;icon to add more users. If you wish to remove a user field you&#39;ve entered, use the <img alt="add more" src="/sites/default/files/2021-05/minus.jpg" /> icon.<br />
        <br />
        If you are looking to remove access to a folder, please select <strong>Remove acess for one or more users to the shared folder selected above</strong>&nbsp;from the <em>Existing Folder Request Type</em> field
      '#more_title': 'Description of Access Levels'
      '#more': |-
        <strong>Read </strong>- User will have Read-Only permissions to the share. They will not be able to write any data, and if any changes need to be made to a document, they will first need to make a local copy, edit and save it, and request someone with Modify permissions to save it back to the share.<br />
        <br />
        <strong>Read/Write</strong> - The implied permission is that a person with read/write access to a shared folder can do everything except delete. &nbsp;That is, they can create files, edit existing files, change file and folder names, etc. &nbsp;However, that is not the case.
        <ol>
        	<li>The user will be able to create a subfolder within the main folder, but they will not be able to change the name so you will&nbsp;be stuck with NewFolder1, etc. &nbsp;To change the name, they will need to copy the new folder to their desktop, rename it, and&nbsp;then copy it back.</li>
        	<li>The user WILL be able to create a new file in the folder and edit existing files that THEY create. &nbsp;To change the name, they&nbsp;will need to copy the new file to their desktop, rename it, and then copy it back</li>
        	<li>The user will NOT be able to make changes to existing files in the folder or any subfolders that were created by someone else.</li>
        	<li>To make changes to a file owned by someone else, the user will have to again, copy it to their desktop, make the desired changes and then copy it back. &nbsp;However, since they cannot make changes to an existing file created by someone else, they will have to give the new file a different name. &nbsp;Renaming existing files / folders owned by someone other than you requires the &quot;delete&quot; permission, which Read/Write access does not provide</li>
        </ol>
        <strong>Modify </strong>- This gives the users full rights to read, write, modify, and delete files in the share, without needing to save files locally first and/or save them under a different name.
      '#multiple__item_label': names
      '#multiple__no_items_message': 'No names entered. Please add names and permissions below.'
      '#multiple__sorting': false
      '#multiple__add_more_input': false
      '#multiple__add_more_button_label': 'Add more users'
      '#element':
        name:
          '#type': textfield
          '#title': Name
          '#description': 'Enter the first and last name of the person you want to grant access to'
        access_type_options:
          '#type': radios
          '#options':
            read: Read
            read_write: Read/Write
            modify: 'Modify (Read/Write/Delete)'
          '#title': 'Access Type'
          '#description': 'Select which level of access you want this person to have'
  transfer_ownership:
    '#type': webform_section
    '#title': 'Transfer Ownership'
    '#title_tag': h3
    '#states':
      visible:
        ':input[name="existing_folder_request_type"]':
          value: owner
    new_folder_owner_email:
      '#type': email
      '#title': 'New Folder Owner Email'
      '#description': 'Enter the email address of the <strong>NEW</strong> owner of this shared folder.'
      '#required': true
  additional_instructions:
    '#type': textarea
    '#title': 'Additional Instructions'
    '#description': 'Please provide any additional instructions or information.'
    '#states':
      invisible:
        ':input[name="existing_folder_request_type"]':
          value: size
  original_folder_name:
    '#type': hidden
    '#title': 'Original Folder Name'
  folder_owner_message:
    '#type': webform_message
    '#states':
      visible:
        ':input[name="request_type"]':
          value: Existing
    '#message_type': warning
    '#message_message': 'If you are the folder owner and entered the request, please watch your email inbox for an approval request from the system as it will come to you almost immediately after you submit the request.'
    '#message_close': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      disabled:
        ':input[name="existing_folder_request_type"]':
          value: size
css: ''
javascript: "(function ($, Drupal) {\r\n  function moveEmptyOptionToTop(select) {\r\n    const $select = $(select);\r\n    const $option = $select.find('option[value=\"_none\"]');\r\n    if ($option.length && $select.find('option:first').val() !== '_none') {\r\n      $option.remove();\r\n      $select.prepend($option);\r\n    }\r\n  }\r\n\r\n  function observeSHSContainer() {\r\n    const observer = new MutationObserver(function (mutations) {\r\n      mutations.forEach(function (mutation) {\r\n        mutation.addedNodes.forEach(function (node) {\r\n          if (node.nodeType === 1 && node.tagName === 'SELECT' && $(node).hasClass('shs-select')) {\r\n            moveEmptyOptionToTop(node);\r\n          }\r\n        });\r\n      });\r\n    });\r\n\r\n    // Observe all changes under webform\r\n    const target = document.querySelector('form.webform-submission-form');\r\n    if (target) {\r\n      observer.observe(target, { childList: true, subtree: true });\r\n\r\n      // Also fix already visible selects\r\n      $(target).find('select.shs-select').each(function () {\r\n        moveEmptyOptionToTop(this);\r\n      });\r\n    }\r\n  }\r\n\r\n  Drupal.behaviors.shsFixEmptyOption = {\r\n    attach: function () {\r\n      observeSHSContainer();\r\n    }\r\n  };\r\n})(jQuery, Drupal);\r\n"
